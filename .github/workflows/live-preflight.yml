name: Fabric live preflight

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, test, prod]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      FABRIC_CAPACITY_NONPROD: ${{ vars.FABRIC_CAPACITY_NONPROD }}
      FABRIC_CAPACITY_PROD: ${{ vars.FABRIC_CAPACITY_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[live]"
      - run: python -m fabricops.cli preflight --output artifacts/preflight
      - run: python -m fabricops.cli discover --output artifacts/preflight
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-live-preflight-${{ inputs.environment }}
          path: artifacts/preflight

