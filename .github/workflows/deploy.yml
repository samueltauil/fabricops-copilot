name: Governed Fabric promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [test, prod]
        required: true
      apply:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m fabricops.cli plan --use-case deploy --output artifacts/deploy
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-plan-${{ inputs.environment }}
          path: artifacts/deploy
      - if: ${{ inputs.apply }}
        run: python -m fabricops.cli apply --plan artifacts/deploy/deploy-plan.json --output artifacts/deploy

