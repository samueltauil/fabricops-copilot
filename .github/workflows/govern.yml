name: Fabric governance drift

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m fabricops.cli drift --output artifacts/govern
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-governance-drift
          path: artifacts/govern

