name: Fabric morning health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m fabricops.cli health --output artifacts/operate
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-morning-health
          path: artifacts/operate

