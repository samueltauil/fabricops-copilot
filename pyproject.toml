[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricops-copilot"
version = "0.1.0"
description = "Configuration-driven Microsoft Fabric administration demos"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
live = ["azure-identity>=1.19"]

[project.scripts]
fabricops = "fabricops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
